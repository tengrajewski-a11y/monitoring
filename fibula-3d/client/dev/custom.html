<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fibula 3D – własne modele</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1612; color: #e9dcc3; font: 14px system-ui, sans-serif; overflow: hidden; }
    #bar { position: fixed; top: 8px; left: 8px; z-index: 2; display: flex; gap: 6px; align-items: center; }
    #bar a { color: #f0c35a; background: #2a2119; padding: 4px 8px; text-decoration: none; border: 1px solid #6e5a42; }
    .lbl { position: absolute; transform: translate(-50%, 0); font-size: 12px; color: #fff; text-shadow: 1px 1px 0 #000; pointer-events: none; white-space: nowrap; text-align: center; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three-addons/" } }
  </script>
</head>
<body>
  <!-- Models from assets/models/custom as the game places them. The red arrow is the front:
       the creature should look along it. Ticks every 30 degrees; if the head points d degrees
       away from the arrow, change --rot / rotY by -d (positive turns counter-clockwise seen from above). -->
  <div id="bar"><a href="?">Z boku</a><a href="?top">Z góry</a><span id="info"></span></div>
  <div id="labels"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { assets, loadAssets, cloneCustom } from '/js/assets.js';

    const params = new URLSearchParams(location.search);
    const top = params.has('top');
    const only = params.get('only')?.split(',');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2c3a2a);
    scene.add(new THREE.HemisphereLight(0xfff4e0, 0x404830, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(3, 6, 4);
    scene.add(sun);

    await loadAssets();
    const keys = [...assets.custom.keys()].filter((k) => !only || only.includes(k)).sort();
    document.getElementById('info').textContent = keys.length ? `${keys.length} model(e)` : 'brak modeli w custom/manifest.json';
    const cols = Math.max(1, Math.ceil(Math.sqrt(keys.length)));
    const models = keys.map((key) => cloneCustom(key).root);
    const reach = Math.max(0.4, ...models.map((m) => new THREE.Box3().setFromObject(m).getSize(new THREE.Vector3()).length() / 2));
    const gap = reach * 2.6;
    const labels = [];
    const line = (pts, color) => new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color }));
    keys.forEach((key, i) => {
      const x = (i % cols) * gap, z = Math.floor(i / cols) * gap;
      const cell = new THREE.Group();
      cell.position.set(x, 0, z);
      const ring = [];
      for (let a = 0; a <= 64; a++) ring.push(new THREE.Vector3(Math.cos(a / 64 * Math.PI * 2) * reach, 0.01, Math.sin(a / 64 * Math.PI * 2) * reach));
      cell.add(line(ring, 0x8a9a70));
      for (let d = 0; d < 360; d += 30) {
        const r = (d * Math.PI) / 180; // 0 deg = +Z (front), counter-clockwise from above
        cell.add(line([new THREE.Vector3(Math.sin(r) * reach * 0.9, 0.01, Math.cos(r) * reach * 0.9), new THREE.Vector3(Math.sin(r) * reach * 1.1, 0.01, Math.cos(r) * reach * 1.1)], 0xc8d8a0));
      }
      const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0.02, 0), reach * 1.2, 0xff3030, reach * 0.2, reach * 0.12);
      cell.add(arrow);
      cell.add(models[i]);
      scene.add(cell);
      const el = document.createElement('div');
      el.className = 'lbl';
      const cfg = assets.custom.get(key).cfg;
      el.textContent = `${key} (rotY ${cfg.rotY || 0})`;
      document.getElementById('labels').appendChild(el);
      labels.push([el, new THREE.Vector3(x, 0, z + reach * 1.25)]);
    });

    const w = (cols - 1) * gap, h = (Math.ceil(keys.length / cols) - 1) * gap;
    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(w / 2, 0.3, h / 2);
    const span = Math.max(w, h) + gap;
    if (top) camera.position.set(w / 2, span * 1.45, h / 2 + 0.001);
    else camera.position.set(w / 2, span * 0.75, h / 2 + span * 1.05);
    controls.update();

    const v = new THREE.Vector3();
    function frame() {
      requestAnimationFrame(frame);
      renderer.render(scene, camera);
      for (const [el, p] of labels) {
        v.copy(p).project(camera);
        el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
        el.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
      }
    }
    frame();
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
  </script>
</body>
</html>
